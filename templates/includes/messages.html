{% if messages %}
<div class="messages" role="status" aria-live="polite">
    {% for message in messages %}
    <div class="alert alert-{{ message.tags }}">
        <span>{{ message }}</span>
        <button type="button" class="alert-close" aria-label="Dismiss">&times;</button>
    </div>
    {% endfor %}
</div>
{% endif %}
